<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Marketplace</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-color);
            padding: 2rem 1rem;
        }
        .auth-card {
            width: 100%;
            max-width: 450px;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .auth-logo {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 2rem;
            text-decoration: none;
            display: block;
        }
        .auth-logo span {
            color: var(--text-color);
        }
        .form-control-auth {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.25rem;
        }
        .form-control-auth:focus {
            background-color: var(--bg-color);
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            color: var(--text-color);
        }
        .btn-auth {
            background-color: var(--primary-color);
            color: white;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 600;
            width: 100%;
            border: none;
            transition: all 0.2s;
        }
        .btn-auth:hover {
            background-color: var(--primary-hover);
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-muted);
            margin: 1.5rem 0;
            font-size: 0.875rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }
        .divider:not(:empty)::before {
            margin-right: .5em;
        }
        .divider:not(:empty)::after {
            margin-left: .5em;
        }
        .social-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.6rem;
            border-radius: 8px;
            font-weight: 500;
            width: 100%;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            text-decoration: none;
        }
        .social-btn:hover {
            background-color: var(--border-color);
            color: var(--text-color);
        }
        .theme-toggle-auth {
            position: absolute;
            top: 20px;
            right: 20px;
        }
    </style>
</head>
<body>

    <button id="theme-toggle" class="theme-toggle theme-toggle-auth" title="Toggle Theme">
        <i class="fas fa-moon"></i>
    </button>

    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="auth-logo">Marketplace<span>.</span></a>
            <h2 class="fs-4 fw-bold mb-1 text-center">Welcome back</h2>
            <p class="text-muted text-center mb-4 fs-7">Enter your details to sign in to your account</p>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label fs-7 fw-medium text-secondary-custom">Email address</label>
                    <input type="email" id="loginEmail" class="form-control form-control-auth" placeholder="name@example.com" required>
                </div>
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label fs-7 fw-medium text-secondary-custom mb-0">Password</label>
                        <a href="#" class="text-primary text-decoration-none fs-7 fw-medium">Forgot password?</a>
                    </div>
                    <input type="password" id="loginPassword" class="form-control form-control-auth" placeholder="••••••••" required>
                </div>
                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label fs-7 text-secondary-custom" for="rememberMe">Remember me</label>
                </div>
                
                <div id="loginAlert" class="alert d-none fs-7" role="alert"></div>

                <button type="submit" id="loginSubmitBtn" class="btn-auth">
                    <span class="spinner-border spinner-border-sm d-none me-2" role="status" aria-hidden="true" id="loginSpinner"></span>
                    <span id="loginBtnText">Sign In</span>
                </button>
            </form>



            <p class="text-center mt-4 mb-0 fs-7 text-secondary-custom">
                Don't have an account? <a href="register.html" class="text-primary fw-bold text-decoration-none">Sign up</a>
            </p>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
