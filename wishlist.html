<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist | Marketplace</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Header -->
    <header class="bg-surface border-bottom border-custom sticky-top py-3">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-6 col-lg-2">
                    <a href="index.html" class="navbar-brand">Marketplace<span style="color:var(--text-color);">.</span></a>
                </div>
                <div class="col-12 col-lg-6 d-none d-lg-block">
                    <form class="d-flex position-relative">
                        <input type="search" class="form-control search-bar" placeholder="Search products..." aria-label="Search">
                        <button class="search-btn" type="submit"><i class="fas fa-search"></i></button>
                    </form>
                </div>
                <div class="col-6 col-lg-4 d-flex justify-content-end align-items-center">
                    <a href="products.html" class="nav-icon d-none d-lg-block me-3 text-secondary-custom">
                        <i class="fas fa-th-large"></i> <span style="font-size: 0.9rem; margin-left: 5px;">Categories</span>
                    </a>
                    <a href="wishlist.html" class="nav-icon text-danger">
                        <i class="fas fa-heart"></i>
                        <span class="badge rounded-pill badge-notification d-none" id="wishlist-badge"></span>
                    </a>
                    <a href="cart.html" class="nav-icon ms-4">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="badge rounded-pill badge-notification d-none" id="cart-badge"></span>
                    </a>
                    <a href="notifications.html" class="nav-icon ms-4 d-none d-lg-block">
                        <i class="far fa-bell"></i>
                        <span class="badge rounded-pill badge-notification d-none" id="notification-badge"></span>
                    </a>
                    <a href="profile.html" class="nav-icon ms-4">
                        <i class="far fa-user"></i>
                    </a>
                    <button id="theme-toggle" class="theme-toggle ms-4" title="Toggle Theme">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">My Wishlist <span id="wishlist-count-text" class="text-muted fs-5">(2 items)</span></h2>
            <button id="clear-wishlist-btn" class="btn btn-outline-danger btn-sm"><i class="fas fa-trash me-2"></i>Clear All</button>
        </div>

        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="wishlist-items-container">
            <!-- Wishlist Item 1 -->
            <div class="col">
                <div class="product-card h-100">
                    <a href="product-details.html" class="text-decoration-none">
                        <div class="product-image-wrap">
                            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=1999&auto=format&fit=crop" alt="Product" class="product-image">
                        </div>
                    </a>
                    <button class="btn-wishlist text-danger border-danger"><i class="fas fa-trash"></i></button>
                    <div class="product-info">
                        <a href="product-details.html" class="text-decoration-none">
                            <h3 class="product-title">Apple Watch Series 8</h3>
                        </a>
                        <div class="product-price mb-2">৳ 32,500</div>
                        <div class="text-success fs-7 mb-3"><i class="fas fa-check-circle me-1"></i> In Stock</div>
                        <a href="cart.html" class="btn btn-primary-custom w-100 text-center d-block text-decoration-none"><i class="fas fa-shopping-cart me-2"></i>Move to Cart</a>
                    </div>
                </div>
            </div>
            
            <!-- Wishlist Item 2 -->
            <div class="col">
                <div class="product-card h-100">
                    <a href="product-details.html" class="text-decoration-none">
                        <div class="product-image-wrap">
                            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=2070&auto=format&fit=crop" alt="Product" class="product-image">
                        </div>
                    </a>
                    <button class="btn-wishlist text-danger border-danger"><i class="fas fa-trash"></i></button>
                    <div class="product-info">
                        <a href="product-details.html" class="text-decoration-none">
                            <h3 class="product-title">Sony WH-1000XM4</h3>
                        </a>
                        <div class="product-price mb-2">৳ 25,500</div>
                        <div class="text-success fs-7 mb-3"><i class="fas fa-check-circle me-1"></i> In Stock</div>
                        <a href="cart.html" class="btn btn-primary-custom w-100 text-center d-block text-decoration-none"><i class="fas fa-shopping-cart me-2"></i>Move to Cart</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
