<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Marketplace</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Header -->
    <header class="bg-surface border-bottom border-custom sticky-top py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="index.html" class="navbar-brand">Marketplace<span style="color:var(--text-color);">.</span> - Checkout</a>
            <button id="theme-toggle" class="theme-toggle" title="Toggle Theme">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>

    <main class="container my-5">
        <div class="row g-5">
            <!-- Checkout Form -->
            <div class="col-lg-7">
                
                <!-- Step 1: Address -->
                <div class="card border-custom shadow-sm mb-4">
                    <div class="card-header bg-white border-bottom border-custom py-3">
                        <h5 class="mb-0 fs-6 fw-bold"><span class="badge bg-primary me-2">1</span> Shipping Address</h5>
                    </div>
                    <div class="card-body p-4">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label text-muted fs-7">First Name</label>
                                <input type="text" class="form-control" value="Rahim">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted fs-7">Last Name</label>
                                <input type="text" class="form-control" value="Uddin">
                            </div>
                            <div class="col-12">
                                <label class="form-label text-muted fs-7">Phone Number</label>
                                <input type="text" class="form-control" value="+880 1711-000000">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted fs-7">Division</label>
                                <select class="form-select">
                                    <option>Dhaka</option>
                                    <option>Chattogram</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted fs-7">District</label>
                                <select class="form-select">
                                    <option>Dhaka</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label text-muted fs-7">Full Address</label>
                                <textarea class="form-control" rows="2">House 12, Road 5, Dhanmondi</textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Step 2: Payment Method -->
                <div class="card border-custom shadow-sm mb-4">
                    <div class="card-header bg-white border-bottom border-custom py-3">
                        <h5 class="mb-0 fs-6 fw-bold"><span class="badge bg-primary me-2">2</span> Payment Method</h5>
                    </div>
                    <div class="card-body p-4">
                        <div class="form-check border rounded p-3 mb-3 d-flex align-items-center">
                            <input class="form-check-input me-3" type="radio" name="payment" id="cod" checked>
                            <label class="form-check-label w-100 d-flex justify-content-between align-items-center" for="cod">
                                <span><i class="fas fa-money-bill-wave text-success me-2"></i> Cash on Delivery</span>
                            </label>
                        </div>
                        <div class="form-check border rounded p-3 mb-3 d-flex align-items-center">
                            <input class="form-check-input me-3" type="radio" name="payment" id="bkash">
                            <label class="form-check-label w-100 d-flex justify-content-between align-items-center" for="bkash">
                                <span><i class="fas fa-mobile-alt text-primary me-2"></i> bKash</span>
                                <span class="badge bg-light text-dark border">bKash</span>
                            </label>
                        </div>
                        <div class="form-check border rounded p-3 d-flex align-items-center">
                            <input class="form-check-input me-3" type="radio" name="payment" id="card">
                            <label class="form-check-label w-100 d-flex justify-content-between align-items-center" for="card">
                                <span><i class="far fa-credit-card text-warning me-2"></i> Credit / Debit Card (SSLCommerz)</span>
                                <div>
                                    <span class="badge bg-light text-dark border">Visa</span>
                                    <span class="badge bg-light text-dark border">MC</span>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Order Summary Sidebar -->
            <div class="col-lg-5">
                <div class="card border-custom shadow-sm sticky-top" style="top: 100px;">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 fs-6 fw-bold">Order Review</h5>
                    </div>
                    <div class="card-body">
                        <!-- Items -->
                        <div id="checkout-items-container">
                            <div class="text-center py-4"><span class="spinner-border text-primary"></span></div>
                        </div>

                        <!-- Totals -->
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-secondary-custom">Subtotal</span>
                            <span class="fw-bold" id="checkout-subtotal">৳ 0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-secondary-custom">Shipping</span>
                            <span class="fw-bold" id="checkout-shipping">৳ 60</span>
                        </div>
                        <div class="d-flex justify-content-between mb-4">
                            <span class="text-secondary-custom">Tax</span>
                            <span class="fw-bold" id="checkout-tax">৳ 0</span>
                        </div>
                        
                        <hr class="border-custom">
                        
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <span class="fw-bold fs-5">Total Pay</span>
                            <span class="fw-bold fs-4 text-primary" id="checkout-total">৳ 0</span>
                        </div>

                        <button class="btn btn-primary-custom w-100 py-3 d-flex justify-content-between align-items-center" onclick="placeOrder()">
                            <span>Place Order</span>
                            <span id="checkout-btn-total">৳ 0</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
